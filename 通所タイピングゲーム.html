<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通所タイピングゲーム</title>

  <style>
    /* ==================================================
       1. 変数定義・ベーススタイル
       ================================================== */
:root {
  --main-bg: linear-gradient(135deg, #ffffff 0%, #f9fdf0 100%);
  --accent-color: #d5ef8b;
  --accent-dark: #7a8c35;
  --text-color: #4a5d23;
  --white: #ffffff;
  --shadow-soft: 0 20px 60px rgba(213, 239, 139, 0.3);
  --font-main:
    'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans',
    sans-serif;
}

body {
  background: var(--main-bg);
  color: var(--text-color);
  font-family: var(--font-main);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  overflow: hidden;
}

body::before {
  content: '';
  position: absolute;
  inset: 0;
  background: transparent
    url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
  opacity: 0.05;
  pointer-events: none;
}

/* ==================================================
       2. アニメーション・エフェクト
       ================================================== */
#miss-flash {
  position: fixed;
  inset: 0;
  background-color: rgba(255, 160, 122, 0.2);
  opacity: 0;
  pointer-events: none;
  z-index: 9999;
}
.flash-active {
  animation: flash-animation 0.2s ease-out;
}
@keyframes flash-animation {
  0% {
    opacity: 1;
  }
  100% {
    opacity: 0;
  }
}
.shake {
  animation: shake-anim 0.2s;
}
@keyframes shake-anim {
  0%,
  100% {
    transform: translateX(0);
  }
  25% {
    transform: translateX(-5px);
  }
  75% {
    transform: translateX(5px);
  }
}
.blur {
  filter: blur(8px);
  transition: filter 0.3s;
}

/* ==================================================
       3. メインレイアウト・ヘッダー
       ================================================== */
.container {
  width: 90%;
  max-width: 1000px;
  background-color: var(--white);
  padding: 30px;
  border-radius: 40px;
  box-shadow: var(--shadow-soft);
  border: 5px solid var(--accent-color);
  position: relative;
  z-index: 1;
}

header {
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
#file-controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  font-size: 1rem;
}
.text-link-action {
  background: none;
  border: none;
  padding: 0;
  color: var(--accent-dark);
  text-decoration: underline;
  text-underline-offset: 4px;
  cursor: pointer;
  font-weight: bold;
  font-size: 1rem;
  font-family: inherit;
  transition: color 0.2s;
}
.text-link-action:hover {
  color: #a5c73d;
  text-decoration: none;
}
.separator {
  color: var(--accent-color);
  user-select: none;
}
#file-status {
  height: 1.5em;
  color: #a5c73d;
  font-weight: bold;
  margin-top: 10px;
  text-align: center;
  font-size: 1rem;
  width: 100%;
}

/* ==================================================
       4. ゲームエリア
       ================================================== */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-bottom: 20px;
  font-weight: bold;
}
.stat-item span {
  color: #333;
  background: #f4fce3;
  padding: 2px 10px;
  border-radius: 8px;
}

.commute-stage {
  width: 100%;
  max-width: 700px;
  margin: 0 auto 20px;
}
.commute-road {
  height: 80px;
  border-bottom: 4px solid var(--accent-color);
  position: relative;
  background: rgba(213, 239, 139, 0.08);
  border-radius: 20px 20px 0 0;
  overflow: hidden;
}
.player-sprite {
  width: 50px;
  position: absolute;
  bottom: 5px;
  left: 0%;
  transition: left 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.goal-building {
  width: 70px;
  position: absolute;
  bottom: 5px;
  right: 15px;
}
#distance-info {
  background: #fdfef0;
  padding: 8px;
  font-weight: bold;
  color: var(--accent-dark);
  border-radius: 0 0 20px 20px;
  border: 1px solid var(--accent-color);
  text-align: center;
  font-size: 0.9rem;
}

.typing-board {
  min-height: 240px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: #fdfef0;
  border-radius: 30px;
  margin-bottom: 25px;
}
.mode-badge {
  background: var(--accent-color);
  color: var(--accent-dark);
  padding: 4px 15px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: bold;
  margin-bottom: 10px;
}
.hira-text {
  font-size: 1.3rem;
  color: #999;
  min-height: 1.5em;
}
.main-word {
  font-size: 3.5rem;
  font-weight: bold;
  margin: 10px 0;
  min-height: 1.2em;
  text-shadow: 2px 2px 0 var(--accent-color);
  text-align: center;
}
.roma-text {
  font-size: 1.8rem;
  color: #ccc;
  letter-spacing: 0.1em;
  min-height: 1.2em;
  text-align: center;
}
.roma-text span.typed {
  color: #a5c73d;
  border-bottom: 3px solid var(--accent-color);
}

#input {
  font-size: 2rem;
  padding: 15px;
  border-radius: 20px;
  border: 3px solid #eee;
  width: 80%;
  max-width: 500px;
  text-align: center;
  outline: none;
  transition: all 0.3s;
}
#input:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 20px rgba(213, 239, 139, 0.4);
}
.miss #input {
  background-color: #fff0f0;
  border-color: #ffb3b3;
}

/* ==================================================
       5. ボタン・コントロール
       ================================================== */
.control-panel {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 30px;
  padding-top: 20px;
}
.time-btn {
  padding: 15px 30px;
  font-size: 1.2rem;
  border: 3px solid var(--accent-color);
  background: var(--white);
  color: var(--accent-dark);
  border-radius: 20px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--accent-color);
  transition: all 0.2s;
}
.time-btn:hover:not(.active) {
  background: #f4fce3;
}
.time-btn:active:not(.active) {
  transform: translateY(4px);
  box-shadow: none;
}
.time-btn.active {
  background: var(--accent-color);
  transform: translateY(6px);
  box-shadow: none;
}

.main-start-btn {
  padding: 15px 45px;
  font-size: 1.4rem;
  background: var(--white);
  border: 3px solid var(--accent-color);
  color: var(--accent-dark);
  border-radius: 50px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 6px 0 var(--accent-color);
  transition: all 0.2s;
}
.main-start-btn:hover {
  background: #f4fce3;
}
.main-start-btn:active {
  transform: translateY(4px);
  box-shadow: none;
}
.main-start-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ==================================================
       6. モーダル
       ================================================== */
#countdown {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(10px);
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 8rem;
  font-weight: 900;
  color: var(--accent-dark);
  z-index: 10000;
  text-shadow: 0 10px 30px rgba(122, 140, 53, 0.2);
}
.result-overlay {
  position: fixed;
  inset: 0;
  background: rgba(255, 255, 255, 0.9);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 20000;
  backdrop-filter: blur(15px);
}
.result-card {
  background: var(--white);
  width: 90%;
  max-width: 700px;
  padding: 50px;
  border-radius: 40px;
  border: 8px solid var(--accent-color);
  text-align: center;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.1);
  animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  0% {
    transform: scale(0.8);
    opacity: 0;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.result-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  background: #fdfef0;
  padding: 30px;
  border-radius: 20px;
  margin: 30px 0;
}
.res-label {
  display: block;
  font-size: 0.9rem;
  color: #8da145;
  margin-bottom: 5px;
}
.res-value {
  font-size: 2.5rem;
  font-weight: bold;
  color: var(--accent-dark);
}
.btn-group {
  display: flex;
  gap: 20px;
  justify-content: center;
}
.action-btn {
  padding: 15px 35px;
  font-size: 1.1rem;
  font-weight: bold;
  border-radius: 30px;
  border: 2px solid var(--accent-color);
  cursor: pointer;
  transition: 0.2s;
}
.btn-primary {
  background: var(--accent-color);
  color: var(--accent-dark);
}
.btn-secondary {
  background: var(--white);
  color: var(--accent-dark);
}

/* AIモーダルスタイル */
.ai-card {
  text-align: left;
  padding: 40px;
  max-width: 600px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-weight: bold;
  color: var(--text-color);
  margin-bottom: 8px;
  font-size: 0.95rem;
}
.form-group input[type='text'],
.form-group input[type='number'] {
  width: 100%;
  padding: 12px 15px;
  border: 2px solid #eee;
  border-radius: 12px;
  font-size: 1rem;
  box-sizing: border-box;
}
.checkbox-group {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
  background: #fdfef0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #eee;
}
.checkbox-group label {
  font-weight: normal;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}
.checkbox-group input[type='checkbox'] {
  transform: scale(1.2);
  accent-color: var(--accent-dark);
}

.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.8);
  z-index: 99999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  color: var(--accent-dark);
  font-size: 1.2rem;
  font-weight: bold;
}
.spinner {
  border: 6px solid #f4fce3;
  border-top: 6px solid var(--accent-dark);
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1s linear infinite;
  margin-bottom: 15px;
}
@keyframes spin {
  0% {
    transform: rotate(0deg);
  }
  100% {
    transform: rotate(360deg);
  }
}

  </style>

  
</head>
<body>
  <div id="miss-flash"></div>
<div id="countdown">3</div>

<main class="container">
  <header>
    <div id="file-controls">
      <button class="text-link-action" onclick="openAiModal()">
        AIで単語を追加
      </button>
      <span class="separator">|</span>
      <label for="csv-file" class="text-link-action" style="cursor: pointer"
        >CSVから追加</label
      >
      <input
        type="file"
        id="csv-file"
        accept=".csv"
        style="display: none"
        onchange="loadWordsFromCSV(event)"
      />
      <span class="separator">|</span>
      <button class="text-link-action" onclick="clearWordList()">
        単語を全削除
      </button>
    </div>
    <div id="file-status"></div>
  </header>

  <section class="game-area">
    <div class="stats-bar">
      <div class="stat-item">制限時間: <span id="timer">60</span>秒</div>
      <div class="stat-item">通所日数: <span id="score">0</span>日</div>
      <div class="stat-item">欠席日数: <span id="miss-count">0</span>日</div>
    </div>

    <div class="commute-stage">
      <div class="commute-road">
        <img
          src="https://github.com/Marlboro0805/typing/blob/main/bo-ningen.gif?raw=true"
          id="player-sprite"
          class="player-sprite"
          alt="Player"
        />
        <img
          src="https://github.com/Marlboro0805/typing/blob/main/building.png?raw=true"
          class="goal-building"
          alt="Goal"
        />
      </div>
      <div id="distance-info">
        就職まであと <span id="remaining-score">15</span> 歩
      </div>
    </div>

    <div id="game-content" class="typing-board">
      <div id="type-label" class="mode-badge">START TO TYPE</div>
      <div id="target-hira" class="hira-text">PRESS SPACE TO START</div>
      <div id="target" class="main-word">READY?</div>
      <div id="roma-guide" class="roma-text"></div>
      <input
        type="text"
        id="input"
        autocomplete="off"
        placeholder="ここにタイピング..."
        disabled
      />
    </div>
  </section>

  <footer class="control-panel">
    <div class="time-selector">
      <button class="time-btn active" onclick="setTime(60, this)">
        準備STG
      </button>
      <button class="time-btn" onclick="setTime(180, this)">実習STG</button>
      <button class="time-btn" onclick="setTime(300, this)">就活STG</button>
    </div>
    <button id="start-button" class="main-start-btn" onclick="startCountdown()">
      通所する
    </button>
  </footer>
</main>

<section id="result-screen" class="result-overlay">
  <div class="result-card">
    <h2 id="result-title">GAME OVER</h2>
    <div class="result-stats">
      <div class="res-item">
        <span class="res-label">通所日数</span>
        <div id="res-score" class="res-value">0</div>
      </div>
      <div class="res-item">
        <span class="res-label">通所率</span>
        <div id="res-acc" class="res-value">0%</div>
      </div>
      <div class="res-item">
        <span class="res-label">欠席日数</span>
        <div id="res-miss" class="res-value">0</div>
      </div>
    </div>
    <div class="btn-group">
      <button class="action-btn btn-primary" onclick="closeResultAndRetry()">
        もう一度挑戦 (SPACE)
      </button>
      <button class="action-btn btn-secondary" onclick="backToTitle()">
        タイトルへ
      </button>
    </div>
  </div>
</section>

<section id="ai-modal" class="result-overlay">
  <div class="result-card ai-card">
    <h2
      style="
        color: var(--accent-dark);
        border-bottom: 3px solid var(--accent-color);
        padding-bottom: 10px;
        display: flex;
        align-items: center;
      "
    >
      ✨ AIで単語を追加
    </h2>

    <div class="form-group" id="api-key-group">
      <label>Gemini APIキーファイル読込:</label>
      <input
        type="file"
        id="api-key-file"
        accept=".txt"
        onchange="loadApiKeyFromFile(event)"
        style="border: none; padding: 0"
      />
      <input type="hidden" id="gemini-api-key" />
    </div>

    <div class="form-group">
      <label>単語のジャンル (テーマ):</label>
      <input
        type="text"
        id="ai-genre"
        placeholder="例：ビジネス用語、IT用語、動物、四字熟語"
      />
    </div>
    <div class="form-group">
      <label>出題タイプ (複数選択可):</label>
      <div class="checkbox-group">
        <label
          ><input type="checkbox" class="ai-type" value="hira" checked />
          ひらがな</label
        >
        <label
          ><input type="checkbox" class="ai-type" value="kanji" checked />
          漢字</label
        >
        <label
          ><input type="checkbox" class="ai-type" value="english" />
          英単語</label
        >
        <label
          ><input type="checkbox" class="ai-type" value="roma" />
          ローマ字</label
        >
      </div>
    </div>
    <div class="form-group">
      <label>生成する個数 (10〜150):</label>
      <input type="number" id="ai-count" min="10" max="150" value="30" />
    </div>
    <div class="btn-group" style="margin-top: 30px">
      <button class="action-btn btn-secondary" onclick="closeAiModal()">
        キャンセル
      </button>
      <button class="action-btn btn-primary" onclick="generateWordsWithAI()">
        生成して追加
      </button>
    </div>
  </div>
</section>

<div id="loading-overlay" class="loading-overlay" style="display: none">
  <div class="spinner"></div>
  <div id="loading-message">AIが単語を考えています...</div>
</div>

  { type: 'hira', kanji: 'たのしい', hira: 'たのしい', roma: 'tanoshii' },
  { type: 'hira', kanji: 'うれしい', hira: 'うれしい', roma: 'ureshii' },
  { type: 'hira', kanji: 'やさしい', hira: 'やさしい', roma: 'yasashii' },
  { type: 'hira', kanji: 'かわいい', hira: 'かわいい', roma: 'kawaii' },
  { type: 'hira', kanji: 'かっこいい', hira: 'かっこいい', roma: 'kakkoii' },
  { type: 'hira', kanji: 'すごい', hira: 'すごい', roma: 'sugoi' },
  { type: 'hira', kanji: 'きれい', hira: 'きれい', roma: 'kirei' },
  { type: 'hira', kanji: 'あした', hira: 'あした', roma: 'ashita' },
  { type: 'hira', kanji: 'きょう', hira: 'きょう', roma: 'kyou' },
  { type: 'hira', kanji: 'きのう', hira: 'きのう', roma: 'kinou' },
  { type: 'hira', kanji: 'あさごはん', hira: 'あさごはん', roma: 'asagohan' },
  { type: 'hira', kanji: 'ひるごはん', hira: 'ひるごはん', roma: 'hirugohan' },
  { type: 'hira', kanji: 'ばんごはん', hira: 'ばんごはん', roma: 'bangohan' },
  { type: 'hira', kanji: 'おやつ', hira: 'おやつ', roma: 'oyatsu' },
  { type: 'hira', kanji: 'おふろ', hira: 'おふろ', roma: 'ofuro' },
  { type: 'hira', kanji: 'ふとん', hira: 'ふとん', roma: 'futon' },
  { type: 'hira', kanji: 'ぐっすり', hira: 'ぐっすり', roma: 'gussuri' },
];

/* ==================================================
       2. グローバル変数
       ================================================== */
let score = 0,
  missCount = 0,
  totalKeyCount = 0,
  timeLeft = 60;
let isPlaying = false,
  isCounting = false,
  timerId = null;
let shuffledWords = [],
  currentIndex = 0,
  currentData = null;
let currentActiveRoma = '',
  currentInputStr = '',
  currentScore = 0;
let goalScore = 15,
  defaultTime = 60;

const targetKanji = document.getElementById('target'),
  targetHira = document.getElementById('target-hira'),
  romaGuide = document.getElementById('roma-guide'),
  input = document.getElementById('input'),
  typeLabel = document.getElementById('type-label'),
  timerDisplay = document.getElementById('timer'),
  scoreDisplay = document.getElementById('score'),
  missDisplay = document.getElementById('miss-count'),
  missFlash = document.getElementById('miss-flash');

/* ==================================================
       3. ローマ字入力・揺れ吸収
       ================================================== */
const ROMA_VARIATIONS = [
  ['shi', 'si', 'ci'],
  ['chi', 'ti'],
  ['tsu', 'tu'],
  ['fu', 'hu'],
  ['ji', 'zi'],
  ['di', 'ji', 'zi'],
  ['du', 'zu'],
  ['sha', 'sya'],
  ['shu', 'syu'],
  ['sho', 'syo'],
  ['cha', 'tya', 'cya'],
  ['chu', 'tyu', 'cyu'],
  ['cho', 'tyo', 'cyo'],
  ['ja', 'zya', 'jya'],
  ['ju', 'zyu', 'jyu'],
  ['jo', 'zyo', 'jyo'],
  ['n', 'nn'],
  ['xtu', 'ltu', 'xtsu', 'ltsu'],
];
['k', 's', 't', 'p', 'c', 'g', 'z', 'd', 'b', 'm', 'r'].forEach((c) => {
  ROMA_VARIATIONS.push([c + c, 'xtsu' + c, 'xtu' + c, 'ltsu' + c, 'ltu' + c]);
});
ROMA_VARIATIONS.push(['tch', 'cch', 'xtsuch', 'xtuch', 'ltsuch', 'ltuch']);

function validateAndMorph(testStr, currentTarget, type) {
  if (type === 'english' || currentTarget.startsWith(testStr)) {
    return {
      isValid: currentTarget.startsWith(testStr),
      newTarget: currentTarget,
    };
  }
  const divergeIdx = testStr.length - 1;
  for (let start = divergeIdx; start >= 0; start--) {
    const targetRemainder = currentTarget.slice(start);
    for (const group of ROMA_VARIATIONS) {
      for (const pattern of group) {
        if (targetRemainder.startsWith(pattern)) {
          for (const alt of group) {
            const temp =
              currentTarget.substring(0, start) +
              alt +
              currentTarget.substring(start + pattern.length);
            if (temp.startsWith(testStr))
              return { isValid: true, newTarget: temp };
          }
        }
      }
    }
  }
  return { isValid: false, newTarget: currentTarget };
}

/* ==================================================
       4. ゲームロジック
       ================================================== */
function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function setWord() {
  if (!isPlaying) return;
  if (currentIndex >= shuffledWords.length) {
    shuffledWords = shuffle([...wordList]);
    currentIndex = 0;
  }
  currentData = shuffledWords[currentIndex++];
  currentActiveRoma = currentData.roma.toLowerCase();
  currentInputStr = '';
  targetKanji.textContent = currentData.kanji;
  targetHira.textContent = currentData.hira;
  const typeMap = {
    hira: 'ひらがな',
    kanji: '漢字',
    roma: 'ローマ字',
    english: '英単語',
  };
  typeLabel.textContent = `【${typeMap[currentData.type] || 'タイピング'}】`;
  input.value = '';
  generateRomaGuide(currentActiveRoma);
  updateGuideHighlight(0);
}

function generateRomaGuide(text) {
  romaGuide.innerHTML = '';
  text.split('').forEach((c) => {
    const s = document.createElement('span');
    s.textContent = c;
    romaGuide.appendChild(s);
  });
}

function updateGuideHighlight(len) {
  const spans = romaGuide.querySelectorAll('span');
  spans.forEach((s, i) =>
    i < len ? s.classList.add('typed') : s.classList.remove('typed'),
  );
}

input.addEventListener('input', () => {
  if (!isPlaying) return;
  const val = input.value.toLowerCase();
  if (val.length < currentInputStr.length) {
    input.value = currentInputStr;
    return;
  }
  totalKeyCount++;
  const res = validateAndMorph(val, currentActiveRoma, currentData.type);
  if (res.isValid) {
    currentInputStr = val;
    if (currentActiveRoma !== res.newTarget) {
      currentActiveRoma = res.newTarget;
      generateRomaGuide(currentActiveRoma);
    }
    updateGuideHighlight(val.length);
    if (val === currentActiveRoma) {
      onTypeSuccess();
      setTimeout(setWord, 50);
    }
  } else {
    missCount++;
    missDisplay.textContent = missCount;
    onTypeMiss();
    triggerMissEffects();
    input.value = currentInputStr;
  }
});

function onTypeSuccess() {
  score++;
  currentScore++;
  scoreDisplay.textContent = score;
  updateCommuteDisplay();
  if (currentScore >= goalScore) showResult(true);
}

function onTypeMiss() {
  currentScore = Math.max(0, currentScore - 1);
  updateCommuteDisplay();
}

function updateCommuteDisplay() {
  document.getElementById('remaining-score').textContent = Math.max(
    0,
    goalScore - currentScore,
  );
  document.getElementById('player-sprite').style.left =
    `${Math.min(90, (currentScore / goalScore) * 90)}%`;
}

function triggerMissEffects() {
  missFlash.classList.add('flash-active');
  setTimeout(() => missFlash.classList.remove('flash-active'), 200);
  document.querySelector('.container').classList.add('shake');
  setTimeout(
    () => document.querySelector('.container').classList.remove('shake'),
    200,
  );
}

function startCountdown() {
  if (isPlaying || isCounting || wordList.length === 0) return;
  isCounting = true;
  setGoal();
  document.getElementById('file-status').textContent = '';
  const el = document.getElementById('countdown');
  el.style.display = 'flex';
  let c = 3;
  el.textContent = c;
  document.getElementById('game-content').classList.add('blur');
  const t = setInterval(() => {
    c--;
    if (c > 0) el.textContent = c;
    else if (c === 0) el.textContent = 'GO!';
    else {
      clearInterval(t);
      el.style.display = 'none';
      isCounting = false;
      startGame();
    }
  }, 1000);
}

function startGame() {
  isPlaying = true;
  score = 0;
  missCount = 0;
  totalKeyCount = 0;
  currentScore = 0;
  timeLeft = defaultTime;
  scoreDisplay.textContent = 0;
  missDisplay.textContent = 0;
  timerDisplay.textContent = timeLeft;
  document.getElementById('game-content').classList.remove('blur');
  input.disabled = false;
  input.value = '';
  input.focus();
  shuffledWords = shuffle([...wordList]);
  setWord();
  timerId = setInterval(() => {
    timeLeft--;
    timerDisplay.textContent = timeLeft;
    if (timeLeft <= 0) showResult(false);
  }, 1000);
}

function showResult(success) {
  isPlaying = false;
  clearInterval(timerId);
  input.disabled = true;
  const title = document.getElementById('result-title');
  title.textContent = success ? '就職おめでとう！' : 'もう少しがんばろう！';
  title.style.color = success ? '#7a8c35' : '#d2691e';
  const acc =
    totalKeyCount > 0
      ? (((totalKeyCount - missCount) / totalKeyCount) * 100).toFixed(1)
      : 0;
  document.getElementById('res-score').textContent = score;
  document.getElementById('res-acc').textContent = acc + '%';
  document.getElementById('res-miss').textContent = missCount;
  document.getElementById('result-screen').style.display = 'flex';
}

function backToTitle() {
  document.getElementById('result-screen').style.display = 'none';
  isPlaying = false;
  isCounting = false;
  score = 0;
  missCount = 0;
  totalKeyCount = 0;
  currentScore = 0;
  scoreDisplay.textContent = '0';
  missDisplay.textContent = '0';
  updateCommuteDisplay();
  targetKanji.textContent = 'READY?';
  targetHira.textContent = 'PRESS SPACE TO START';
  romaGuide.textContent = '';
  timerDisplay.textContent = defaultTime;
  typeLabel.textContent = 'START TO TYPE';
  input.value = '';
}

function closeResultAndRetry() {
  backToTitle();
  startCountdown();
}

function setTime(s, el) {
  if (isPlaying || isCounting) return;
  defaultTime = s;
  timerDisplay.textContent = s;
  document
    .querySelectorAll('.time-btn')
    .forEach((b) => b.classList.remove('active'));
  el.classList.add('active');
  setGoal(s);
}

function setGoal(s = defaultTime) {
  if (s === 60) goalScore = 15;
  else if (s === 180) goalScore = 30;
  else goalScore = 60;
  currentScore = 0;
  updateCommuteDisplay();
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && !isCounting && !isPlaying) {
    e.preventDefault();
    if (document.getElementById('ai-modal').style.display === 'flex') return;
    if (document.getElementById('result-screen').style.display === 'flex')
      closeResultAndRetry();
    else startCountdown();
  }
});

// 単語リストの全削除
function clearWordList() {
  if (confirm('現在の単語リストをすべて削除しますか？')) {
    wordList = [];
    backToTitle();
    document.getElementById('file-status').textContent =
      '単語リストをクリアしました';
  }
}

/* ==================================================
       5. CSVファイル読み込み (予備機能)
       ================================================== */
function loadWordsFromCSV(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('file-status').textContent =
    '読み込み中: ' + file.name;

  const reader = new FileReader();
  reader.onload = function (e) {
    const result = e.target.result;
    if (result) {
      processCSVText(result, file.name);
    }
  };
  reader.onerror = function () {
    alert('読み取りエラーが発生しました');
  };
  reader.readAsText(file, 'UTF-8');
  event.target.value = ''; // Inputリセット
}

/* ==================================================
       6. APIキー手動読込 & AI・CSV共通処理
       ================================================== */
const INTERNAL_SECRET_KEY = 'TaskAppGeminiSecretLock2026';

function cipher(text, pass) {
  let asciiPass = encodeURIComponent(pass);
  let res = '';
  for (let i = 0; i < text.length; i++)
    res += String.fromCharCode(
      text.charCodeAt(i) ^ asciiPass.charCodeAt(i % asciiPass.length),
    );
  return res;
}

// 画面読み込み時にLocalStorageからAPIキーを復元
window.onload = function () {
  const savedKey = localStorage.getItem('typing_gemini_api_key');
  if (savedKey) {
    document.getElementById('gemini-api-key').value = savedKey;
    const apiGroup = document.getElementById('api-key-group');
    if (apiGroup) apiGroup.style.display = 'none';
  }
};

// ファイルからキーを読み込む処理
function loadApiKeyFromFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    let content = e.target.result.replace(/^[\uFEFF]/, '').trim();
    let extractedKey = '';

    if (content.startsWith('ENC:')) {
      try {
        extractedKey = cipher(
          atob(content.substring(4)),
          INTERNAL_SECRET_KEY,
        ).trim();
      } catch (err) {
        alert('ファイルの読み込みに失敗しました。');
        event.target.value = '';
        return;
      }
    } else {
      extractedKey = content;
    }

    if (extractedKey) {
      document.getElementById('gemini-api-key').value = extractedKey;
      localStorage.setItem('typing_gemini_api_key', extractedKey);
      alert('APIキーを読み込みました！');
      document.getElementById('api-key-group').style.display = 'none';
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

function openAiModal() {
  document.getElementById('ai-modal').style.display = 'flex';
  if (localStorage.getItem('typing_gemini_api_key')) {
    document.getElementById('api-key-group').style.display = 'none';
  } else {
    document.getElementById('api-key-group').style.display = 'block';
  }
}

function closeAiModal() {
  document.getElementById('ai-modal').style.display = 'none';
}

async function generateWordsWithAI() {
  const apiKey = document.getElementById('gemini-api-key').value.trim();
  const genre = document.getElementById('ai-genre').value.trim();
  const count = document.getElementById('ai-count').value;
  const checkboxes = document.querySelectorAll('.ai-type:checked');
  const types = Array.from(checkboxes).map((cb) => cb.value);

  if (!apiKey) return alert('APIキーファイルを読み込んでください。');
  if (!genre) return alert('ジャンルを入力してください。');
  if (types.length === 0) return alert('タイプを選択してください。');

  document.getElementById('loading-overlay').style.display = 'flex';
  const prompt = `タイピングゲーム用のCSV（ヘッダーなし）を生成してください。ジャンル:${genre}, 個数:${count}, タイプ:${types.join(',')}\nフォーマット: type,kanji,hira,roma\n※CSVテキストのみ出力すること。`;

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
      },
    );
    if (!response.ok) throw new Error('API request failed');
    const data = await response.json();
    let csvText = data.candidates[0].content.parts[0].text.trim();
    csvText = csvText
      .replace(/```csv/gi, '')
      .replace(/```/g, '')
      .trim();

    // AI生成テキストも共通関数で処理
    const addedCount = processCSVText(csvText, 'AI');
    if (addedCount > 0) {
      closeAiModal();
      document.getElementById('file-status').textContent =
        `✅ AIが「${genre}」の単語を ${addedCount}件 追加しました！`;
    }
  } catch (err) {
    alert('生成に失敗しました: ' + err.message);
  } finally {
    document.getElementById('loading-overlay').style.display = 'none';
  }
}

// AI・手動CSVの共通解析処理
function processCSVText(csvText, sourceName) {
  try {
    const lines = csvText
      .split(/\r\n|\n/)
      .map((l) => l.trim())
      .filter((l) => l !== '');

    // ヘッダー行があればスキップする判定
    let startIndex = 0;
    if (
      lines[0] &&
      (lines[0].toLowerCase().includes('kanji') ||
        lines[0].includes('漢字') ||
        lines[0].toLowerCase().includes('type'))
    ) {
      startIndex = 1;
    }

    const newWords = lines
      .slice(startIndex)
      .map((line) => {
        const cols = line.split(',');
        if (cols.length < 4 || !cols[0]) return null;
        return { type: cols[0], kanji: cols[1], hira: cols[2], roma: cols[3] };
      })
      .filter((w) => w !== null);

    if (newWords.length > 0) {
      // 単語リストに追記する
      wordList = wordList.concat(newWords);
      backToTitle();

      if (sourceName !== 'AI') {
        document.getElementById('file-status').textContent =
          `✅ ${sourceName} から ${newWords.length}件 追加しました！`;
      }
      return newWords.length;
    } else {
      alert(
        '有効な単語データが見つかりませんでした。カンマ区切りを確認してください。',
      );
      return 0;
    }
  } catch (err) {
    console.error('解析エラー:', err);
    alert('CSVの解析に失敗しました。');
    return 0;
  }
}
